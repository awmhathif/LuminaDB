    <path d="M 110,104 C 110,94 118,86 128,86 L 172,86 C 182,86 190,94 190,104 L 190,336 L 386,336 C 396,336 404,344 404,354 L 404,398 C 404,408 396,416 386,416 L 138,416 C 122,416 110,404 110,388 Z" fill="url(#ink2c)"/>
